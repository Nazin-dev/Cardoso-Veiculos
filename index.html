<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cardoso Veículos — Seu próximo veículo está aqui</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<style>
  :root {
    /* Paleta da marca Cardoso: preto + azul vibrante (logo) */
    --ink-0: #06080b;       /* preto profundo */
    --ink-1: #0c1014;       /* preto carvão */
    --ink-2: #12171d;       /* grafite */
    --ink-3: #1b2229;       /* grafite claro */
    --ink-4: #2a323b;       /* divisor */
    --line: rgba(255,255,255,0.08);
    --line-2: rgba(255,255,255,0.14);

    --petrol-900: #051a3a;
    --petrol-800: #0a2c5e;
    --petrol-700: #0f4ea0;   /* azul cardoso */
    --petrol-600: #1d6bd0;
    --petrol-500: #2b86e6;   /* azul vivo da logo */
    --petrol-400: #4ea2f5;
    --petrol-300: #7ec0ff;

    --gold-500: #b8924a;     /* acento sutil para detalhes */

    --paper: #f5f3ee;
    --bone: #e9e5dc;
    --fg: #f1efe9;
    --fg-dim: #b9beca;
    --fg-mute: #7e8694;

    --whatsapp: #25d366;
    --whatsapp-dark: #128c7e;

    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 18px;

    --maxw: 1280px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--ink-0);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    line-height: 1.55;
  }

  h1, h2, h3, h4 {
    font-family: 'Sora', 'Inter', sans-serif;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
    text-wrap: balance;
  }

  p { margin: 0; text-wrap: pretty; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  ::selection { background: var(--petrol-500); color: var(--fg); }

  .mono { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; letter-spacing: 0.02em; }
  .container { max-width: var(--maxw); margin: 0 auto; padding: 0 32px; }
  @media (max-width: 720px) { .container { padding: 0 18px; } }
  @media (max-width: 480px) { .container { padding: 0 14px; } }

  /* Mobile responsive globals */
  html, body { overflow-x: hidden; max-width: 100vw; }
  * { box-sizing: border-box; }
  img, iframe { max-width: 100%; }

  /* Reduce vertical padding on mobile across sections */
  @media (max-width: 720px) {
    section[style*="padding: 120px"], section[style*="padding:120px"] { padding-top: 64px !important; padding-bottom: 64px !important; }
    section[style*="padding: 100px"], section[style*="padding:100px"] { padding-top: 56px !important; padding-bottom: 56px !important; }
  }

  /* Botão flutuante WhatsApp pulse */
  @keyframes wapulse {
    0%   { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.55), 0 12px 32px rgba(0,0,0,0.4); }
    70%  { box-shadow: 0 0 0 18px rgba(37, 211, 102, 0), 0 12px 32px rgba(0,0,0,0.4); }
    100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0), 0 12px 32px rgba(0,0,0,0.4); }
  }
  @keyframes shine {
    0%   { transform: translateX(-120%) skewX(-15deg); }
    100% { transform: translateX(220%) skewX(-15deg); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 0.7s cubic-bezier(.2,.7,.2,1) both; }

  /* Placeholders para imagens reais (não desenhar SVG complexo) */
  .img-slot {
    position: relative;
    background:
      repeating-linear-gradient(135deg,
        rgba(255,255,255,0.025) 0,
        rgba(255,255,255,0.025) 10px,
        rgba(255,255,255,0.06) 10px,
        rgba(255,255,255,0.06) 20px),
      linear-gradient(180deg, var(--petrol-900), var(--ink-1));
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .img-slot__label {
    position: absolute;
    inset: auto auto 12px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: rgba(255,255,255,0.55);
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    padding: 4px 8px;
    border-radius: 4px;
    letter-spacing: 0.04em;
  }

  /* Direct-edit overrides */
</style>
<style id="__om-edit-overrides"></style>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/shared.jsx"></script>
<script type="text/babel" src="src/home.jsx"></script>
<script type="text/babel" src="src/contatos.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>

</body>
</html>
